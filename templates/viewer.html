<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPL Live Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}?v=2">
</head>
<body>
    <header class="header">
        <div class="header-main">
            <div class="title-wrap">
                <h1>MPL Live Auction Board</h1>
                <p>Mobile-friendly read-only viewer for teams and players</p>
            </div>
            <div class="meta">
                <span id="last-updated">Updating...</span>
            </div>
        </div>

        <div class="overview-grid" id="overview-grid">
            <article class="overview-card">
                <p class="overview-label">Teams</p>
                <p class="overview-value" id="stat-teams">0</p>
            </article>
            <article class="overview-card">
                <p class="overview-label">Sold Players</p>
                <p class="overview-value" id="stat-sold">0</p>
            </article>
            <article class="overview-card">
                <p class="overview-label">Unsold Players</p>
                <p class="overview-value" id="stat-unsold">0</p>
            </article>
            <article class="overview-card">
                <p class="overview-label">Total Purse Left</p>
                <p class="overview-value" id="stat-purse">₹0</p>
            </article>
        </div>
    </header>

    <main class="page">
        <div class="tabs-container">
            <button id="tab-teams" class="tab-btn active" data-tab="teams">Teams</button>
            <button id="tab-players" class="tab-btn" data-tab="players">Players</button>
        </div>

        <section id="section-teams" class="tab-content active">
            <div class="section-head">
                <h2>Teams</h2>
                <div class="tools-inline">
                    <input id="team-search" class="input" type="text" placeholder="Search team or owner">
                    <select id="team-sort" class="input" aria-label="Sort teams">
                        <option value="name">Sort: Name</option>
                        <option value="players">Sort: Players</option>
                        <option value="remaining">Sort: Remaining budget</option>
                    </select>
                </div>
            </div>
            <div id="teams-grid" class="teams-grid"></div>
        </section>

        <section id="section-players" class="tab-content">
            <div class="section-head">
                <h2>All Players</h2>
                <div class="tools-inline">
                    <input id="player-search" class="input" type="text" placeholder="Search serial, name, role">
                    <select id="player-filter" class="input" aria-label="Filter players">
                        <option value="all">All</option>
                        <option value="sold">Sold</option>
                        <option value="unsold">Unsold</option>
                    </select>
                </div>
            </div>
            <div id="players-grid" class="players-grid"></div>
        </section>
    </main>

    <div id="team-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-team-name">
            <div class="modal-handle" aria-hidden="true"></div>
            <div class="modal-header">
                <div>
                    <h3 id="modal-team-name">Team</h3>
                    <p id="modal-team-meta"></p>
                </div>
                <button id="close-modal" class="close-btn" type="button" aria-label="Close team details">X</button>
            </div>

            <div class="modal-summary-grid" id="modal-summary-grid">
                <article class="modal-summary-card">
                    <p class="modal-summary-label">Owner</p>
                    <p class="modal-summary-value" id="modal-owner">-</p>
                </article>
                <article class="modal-summary-card">
                    <p class="modal-summary-label">Players</p>
                    <p class="modal-summary-value" id="modal-players-count">0</p>
                </article>
                <article class="modal-summary-card">
                    <p class="modal-summary-label">Spent</p>
                    <p class="modal-summary-value" id="modal-spent">₹0</p>
                </article>
                <article class="modal-summary-card">
                    <p class="modal-summary-label">Remaining</p>
                    <p class="modal-summary-value" id="modal-remaining">₹0</p>
                </article>
            </div>

            <div class="modal-scroll" id="modal-scroll">
                <div class="modal-tabs" role="tablist" aria-label="Team details sections">
                    <button id="modal-tab-squad" class="modal-tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="team-players">Squad</button>
                    <button id="modal-tab-log" class="modal-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="team-logs">Activity</button>
                </div>

                <section class="modal-section" id="modal-section-squad">
                    <div class="section-title">Bidded Players</div>
                    <div id="team-players" class="players-list"></div>
                </section>

                <section class="modal-section modal-section-log" id="modal-section-log">
                    <div class="section-title">Team Log</div>
                    <div id="team-logs" class="team-logs"></div>
                </section>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='viewer.js') }}?v=2"></script>
</body>
</html>
